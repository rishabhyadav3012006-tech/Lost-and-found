[build]
  publish = "frontend"

# Map /static/* to /src/* so CSS and JS load correctly
[[redirects]]
  from = "/static/*"
  to = "/src/:splat"
  status = 200

# Map /public/* to /public/*
[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

# /api/* and /uploads/photos/* are served by Netlify Functions in netlify/functions

# SPA fallback: all other routes load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
