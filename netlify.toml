[build]
  publish = "frontend"

# Map /static/* to /src/* so CSS and JS load correctly
[[redirects]]
  from = "/static/*"
  to = "/src/:splat"
  status = 200

# Map /public/* to /public/*
[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

# Proxy API requests to your live backend server
# Replace with your actual backend URL once deployed on Render/Railway
[[redirects]]
  from = "/api/*"
  to = "https://lost-and-found-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy uploaded photos to backend
[[redirects]]
  from = "/uploads/*"
  to = "https://lost-and-found-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback: all other routes load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
