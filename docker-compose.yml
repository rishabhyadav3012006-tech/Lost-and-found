version: "3.9"

services:
  app:
    build: .
    container_name: reunite_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the SQLite DB and uploaded photos outside the container
      - ./uploads:/app/uploads
      - ./backend/reunite.db:/app/backend/reunite.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
